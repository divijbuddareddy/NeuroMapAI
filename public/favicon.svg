    <line x1="28" y1="32" x2="36" y2="32" stroke="#ff007a" stroke-width="2" />
    <line x1="22" y1="38" x2="42" y2="38" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="2 2" />
    <circle cx="22" cy="26" r="3.5" fill="#00f2fe" />
